variables:
  projectBase:        './src/StructuredDecisions.Base/StructuredDecisions.Base.csproj'
  projectLaya:        './src/StructuredDecisions.Laya/StructuredDecisions.Laya.csproj'
  projectCatalyst:    './src/StructuredDecisions.Laya.Catalyst/StructuredDecisions.Laya.Catalyst.csproj'
  projectTraining:    './src/StructuredDecisions.Laya.Training/StructuredDecisions.Laya.Training.csproj'
  projectMica:        './src/StructuredDecisions.Mica/StructuredDecisions.Mica.csproj'
  solution:           './StructuredDecisions.slnx'
  buildConfiguration: 'Release'
  targetVersion: yy.M.$(build.buildId)

pool:
  vmImage: 'windows-latest'

trigger:
- main

steps:
- checkout: self
  submodules: true
  fetchDepth: 10

- task: PowerShell@2
  displayName: 'Create CalVer Version'
  inputs:
    targetType: 'inline'
    script: |
      $dottedDate = (Get-Date).ToString("yy.M")
      $buildID = $($env:BUILD_BUILDID)
      $modBuildID = [int]$buildID % 65536  # ensure fits in int16
      $newTargetVersion = "$dottedDate.$modBuildID"
      Write-Host "##vso[task.setvariable variable=targetVersion;]$newTargetVersion"
      Write-Host "Updated targetVersion to '$newTargetVersion'"

# The .NET 11 SDK builds both targets: net11.0 carries the kernels .NET 10 cannot express (512-bit VNNI for Q8_0).
- task: UseDotNet@2
  displayName: 'Use .NET 11.0 SDK'
  inputs:
    packageType: sdk
    version: 11.x
    includePreviewVersions: true
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: DotNetCoreCLI@2
  displayName: 'restore nuget'
  inputs:
    command: 'restore'
    projects: '$(solution)'

# LayaEnableNet11=true publishes net10.0 and net11.0 whatever SDKs the hosted image happens to carry.
- task: DotNetCoreCLI@2
  displayName: 'build StructuredDecisions.Base project'
  inputs:
    command: 'build'
    projects: '$(projectBase)'
    arguments: '-c $(buildConfiguration) /p:Version=$(targetVersion) /p:LayaEnableNet11=true /p:GeneratePackageOnBuild=true'

- task: DotNetCoreCLI@2
  displayName: 'build StructuredDecisions.Laya project'
  inputs:
    command: 'build'
    projects: '$(projectLaya)'
    arguments: '-c $(buildConfiguration) /p:Version=$(targetVersion) /p:LayaEnableNet11=true /p:GeneratePackageOnBuild=true'

- task: DotNetCoreCLI@2
  displayName: 'build StructuredDecisions.Laya.Catalyst project'
  inputs:
    command: 'build'
    projects: '$(projectCatalyst)'
    arguments: '-c $(buildConfiguration) /p:Version=$(targetVersion) /p:LayaEnableNet11=true /p:GeneratePackageOnBuild=true'

- task: DotNetCoreCLI@2
  displayName: 'build StructuredDecisions.Laya.Training project'
  inputs:
    command: 'build'
    projects: '$(projectTraining)'
    arguments: '-c $(buildConfiguration) /p:Version=$(targetVersion) /p:LayaEnableNet11=true /p:GeneratePackageOnBuild=true'

- task: DotNetCoreCLI@2
  displayName: 'build StructuredDecisions.Mica project'
  inputs:
    command: 'build'
    projects: '$(projectMica)'
    arguments: '-c $(buildConfiguration) /p:Version=$(targetVersion) /p:LayaEnableNet11=true /p:GeneratePackageOnBuild=true'

- task: NuGetCommand@2
  displayName: 'push all nuget packages'
  inputs:
    command: 'push'
    packagesToPush: '**/*.nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget-curiosity-org'
