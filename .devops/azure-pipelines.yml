variables:
  projectLaya:        './src/Laya/Laya.csproj'
  projectCatalyst:    './src/Laya.Catalyst/Laya.Catalyst.csproj'
  solution:           './Laya.slnx'
  buildConfiguration: 'Release'
  targetVersion: yy.M.$(build.buildId)

pool:
  vmImage: 'windows-latest'

trigger:
- main

steps:
- checkout: self
  submodules: true
  fetchDepth: 10

- task: PowerShell@2
  displayName: 'Create CalVer Version'
  inputs:
    targetType: 'inline'
    script: |
      $dottedDate = (Get-Date).ToString("yy.M")
      $buildID = $($env:BUILD_BUILDID)
      $modBuildID = [int]$buildID % 65536  # ensure fits in int16
      $newTargetVersion = "$dottedDate.$modBuildID"
      Write-Host "##vso[task.setvariable variable=targetVersion;]$newTargetVersion"
      Write-Host "Updated targetVersion to '$newTargetVersion'"

- task: UseDotNet@2
  displayName: 'Use .NET 10.0 SDK'
  inputs:
    packageType: sdk
    version: 10.x
    includePreviewVersions: false
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: DotNetCoreCLI@2
  displayName: 'restore nuget'
  inputs:
    command: 'restore'
    projects: '$(solution)'

# LayaEnableNet11=false pins the published target frameworks to what this repository has been
# measured on, whatever SDKs the hosted image happens to carry.
- task: DotNetCoreCLI@2
  displayName: 'build Laya project'
  inputs:
    command: 'build'
    projects: '$(projectLaya)'
    arguments: '-c $(buildConfiguration) /p:Version=$(targetVersion) /p:LayaEnableNet11=false /p:GeneratePackageOnBuild=true'

- task: DotNetCoreCLI@2
  displayName: 'build Laya.Catalyst project'
  inputs:
    command: 'build'
    projects: '$(projectCatalyst)'
    arguments: '-c $(buildConfiguration) /p:Version=$(targetVersion) /p:LayaEnableNet11=false /p:GeneratePackageOnBuild=true'

- task: NuGetCommand@2
  displayName: 'push all nuget packages'
  inputs:
    command: 'push'
    packagesToPush: '**/*.nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget-curiosity-org'
