name: NuGet

# Builds, tests and packs the four packages — Laya, Laya.Model.English,
# Laya.Model.Multilingual, Laya.Model.TypedDecisions — and publishes them to nuget.org on
# every push to main. Pull requests build and pack but never publish.
#
# Set up once: a nuget.org API key scoped to Laya* as the repository secret NUGET_API_KEY.
#
# Every package in a run carries the same CalVer version (yy.M.<run number>), so the model
# packages always depend on the Laya build they were produced with. The weights themselves are
# not packaged: the model packages embed only config and tokenizer files and download
# model.safetensors from https://models.curiosity.ai/laya/ on first use.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (default: CalVer yy.M.<run number>)"
        required: false
        type: string
      publish:
        description: "Push the packages to nuget.org"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # The published packages are built for the frameworks the repository supports today. Flip this
  # to true once the runners ship a .NET 11 SDK and the net11.0 target has been measured.
  LAYA_ENABLE_NET11: "false"

jobs:
  pack:
    name: build, test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Source Link records the commit; a shallow clone is enough, but tags make the
          # repository metadata in the package complete.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="$(date -u +%y.%-m).${{ github.run_number }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packing $version"

      # The checkpoint packages embed config and tokenizer files fetched from the model
      # repository; caching them keeps a green build off the network.
      - name: Cache checkpoint assets
        uses: actions/cache@v4
        with:
          path: artifacts/checkpoint-assets
          key: checkpoint-assets-v1

      - name: Restore
        run: dotnet restore Laya.slnx

      - name: Build
        run: >
          dotnet build Laya.slnx -c Release --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:LayaEnableNet11=$LAYA_ENABLE_NET11

      # Parity tests need a checkpoint's weights in artifacts/ and skip themselves without one;
      # everything else — tokenizer, sequence building, calibration, package payload — runs here.
      - name: Test
        run: >
          dotnet test tests/Laya.Tests -c Release --no-build
          -p:Version=${{ steps.version.outputs.version }}
          -p:LayaEnableNet11=$LAYA_ENABLE_NET11

      - name: Pack
        run: >
          dotnet pack Laya.slnx -c Release --no-build
          -p:Version=${{ steps.version.outputs.version }}
          -p:LayaEnableNet11=$LAYA_ENABLE_NET11
          -o artifacts/nupkg

      - name: List packages
        run: ls -lh artifacts/nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.version.outputs.version }}
          path: artifacts/nupkg/*
          if-no-files-found: error

    outputs:
      version: ${{ steps.version.outputs.version }}

  publish:
    name: publish to nuget.org
    needs: pack
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v4
        with:
          name: nupkg-${{ needs.pack.outputs.version }}
          path: artifacts/nupkg

      # The engine goes first: the model packages depend on it at this exact version, and a
      # consumer restoring between the two pushes should never see a model package alone.
      - name: Push Laya
        run: >
          dotnet nuget push "artifacts/nupkg/Laya.${{ needs.pack.outputs.version }}.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Push the checkpoint packages and symbols
        run: >
          dotnet nuget push "artifacts/nupkg/Laya.Model.*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate
