name: NuGet

# Builds, tests and packs the Laya package and publishes it to nuget.org on every push to
# main. Pull requests build and pack but never publish.
#
# Set up once: a nuget.org API key for Laya as the repository secret NUGET_API_KEY.
#
# The package carries no model data at all — every checkpoint file, weights included, is
# downloaded from https://models.curiosity.ai/laya/ into the user's cache on first use — so the
# build needs nothing but the SDK, and the version is CalVer: yy.M.<run number>.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (default: CalVer yy.M.<run number>)"
        required: false
        type: string
      publish:
        description: "Push the packages to nuget.org"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # The published packages are built for the frameworks the repository supports today. Flip this
  # to true once the runners ship a .NET 11 SDK and the net11.0 target has been measured.
  LAYA_ENABLE_NET11: "false"

jobs:
  pack:
    name: build, test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Source Link records the commit; a shallow clone is enough, but tags make the
          # repository metadata in the package complete.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="$(date -u +%y.%-m).${{ github.run_number }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packing $version"

      - name: Restore
        run: dotnet restore Laya.slnx

      - name: Build
        run: >
          dotnet build Laya.slnx -c Release --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:LayaEnableNet11=$LAYA_ENABLE_NET11

      # Parity tests need a checkpoint's weights in artifacts/ and skip themselves without one;
      # everything else — tokenizer, sequence building, calibration, the downloader — runs here.
      - name: Test
        run: >
          dotnet test tests/Laya.Tests -c Release --no-build
          -p:Version=${{ steps.version.outputs.version }}
          -p:LayaEnableNet11=$LAYA_ENABLE_NET11

      - name: Pack
        run: >
          dotnet pack Laya.slnx -c Release --no-build
          -p:Version=${{ steps.version.outputs.version }}
          -p:LayaEnableNet11=$LAYA_ENABLE_NET11
          -o artifacts/nupkg

      - name: List packages
        run: ls -lh artifacts/nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.version.outputs.version }}
          path: artifacts/nupkg/*
          if-no-files-found: error

    outputs:
      version: ${{ steps.version.outputs.version }}

  publish:
    name: publish to nuget.org
    needs: pack
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v4
        with:
          name: nupkg-${{ needs.pack.outputs.version }}
          path: artifacts/nupkg

      # The .snupkg beside it is pushed with it.
      - name: Push Laya
        run: >
          dotnet nuget push "artifacts/nupkg/Laya.${{ needs.pack.outputs.version }}.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate
